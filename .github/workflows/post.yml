name: 블로그 자동 발행

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - draft
          - dry-run

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 및 렌더링 라이브러리 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fonts-noto-cjk fonts-nanum \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
          fc-cache -f

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="publish"; fi
          case "$MODE" in
            draft)   echo "flag=--draft"   >> $GITHUB_OUTPUT ;;
            dry-run) echo "flag=--dry-run" >> $GITHUB_OUTPUT ;;
            *)       echo "flag="          >> $GITHUB_OUTPUT ;;
          esac
          echo "모드: $MODE"

      - name: 글 생성 및 발행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python main.py ${{ steps.mode.outputs.flag }}

      - name: 이미지와 이력 저장소에 커밋
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images data/history.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "자동 발행: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
